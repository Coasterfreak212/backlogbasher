services:
  backlogbasher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backlogbasher
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/consoleerp.db
      - UPLOAD_DIR=/app/data/uploads
      - STEAMGRIDDB_API_KEY=${STEAMGRIDDB_API_KEY:-}
    volumes:
      - ./data:/app/data
